<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parish Bulletin</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Merriweather&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

<body>

        </div>

    <main class="content-wrapper">
        <section class="document-container">
            <!-- Replace with your Google Docs embed code -->
            <iframe

                allowfullscreen>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; <span id="current-year"></span> Župa svete Rozalije Ivanovac</p>
            <nav class="footer-links">
                <a href="/contact">Kontakt</a>

    <script>
        // Auto-update copyright year
        document.getElementById('current-year').textContent = new Date().getFullYear();
